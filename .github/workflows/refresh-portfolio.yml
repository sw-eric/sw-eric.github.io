name: Refresh portfolio dashboard data

on:
  schedule:
    # 10:00 UTC, Tue-Sat — the morning after each US session. Flex only
    # reports days IBKR has finished end-of-day processing for, so an
    # evening run just after the close still returns the prior day.
    - cron: "0 10 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-22.04
    env:
      # `secrets` can't be referenced directly inside `if:` conditions —
      # stash the check in a job-level env var and branch on that instead.
      HAS_FLEX_SECRETS: ${{ secrets.SONSUDASHBOARD2 != '' && secrets.IBKR_FLEX_QUERY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ env.HAS_FLEX_SECRETS == 'true' }}
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest portfolio snapshot
        if: ${{ env.HAS_FLEX_SECRETS == 'true' }}
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.SONSUDASHBOARD2 }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
        run: python3 scripts/fetch_portfolio.py

      - name: Skip (secrets not configured yet)
        if: ${{ env.HAS_FLEX_SECRETS != 'true' }}
        run: echo "SONSUDASHBOARD2 (Flex token) / IBKR_FLEX_QUERY_ID not set — see scripts/fetch_portfolio.py for setup. Skipping refresh."

      - name: Commit updated data
        if: ${{ env.HAS_FLEX_SECRETS == 'true' }}
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quartz/static/portfolio-data.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh portfolio dashboard data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN doesn't trigger other
      # workflows (GitHub's anti-recursion guard), so deploy.yml would
      # never see this update on its own — dispatch it explicitly.
      - name: Trigger site redeploy
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref v4
